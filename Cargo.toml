[package]
name = "mosaic"
version = "0.0.1"
edition = "2021"
description = "Run Android apps as native Linux processes"
license = "GPL-3.0-or-later"
repository = "https://github.com/yesheytenzin/mosaic"
rust-version = "1.74"

[[bin]]
name = "mosaic"
path = "src/main.rs"

[lib]
name = "mosaic_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
nix = { version = "0.27", features = ["process", "signal", "fs", "user", "socket", "uio"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
chrono = "0.4"
which = "6.0"
serde_json = "1.0"
futures-executor = "0.3"
futures-util = { version = "0.3", default-features = false }
tar = "0.4"
xz2 = "0.1"
parking_lot = "0.12"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
trycmd = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
