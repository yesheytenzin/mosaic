[package]
name = "mosaic"
version = "0.0.1"
edition = "2021"
description = "Android container tool (Rust rewrite of Waydroid)"
license = "GPL-3.0-or-later"
repository = "https://github.com/yesheytenzin/mosaic"
rust-version = "1.74"

[[bin]]
name = "mosaic"
path = "src/main.rs"

[lib]
name = "mosaic_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
fern = { version = "0.7", features = ["colored"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
zvariant = "4.2"
nix = { version = "0.27", features = ["process", "signal", "fs", "user"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
walkdir = "2.5"
dirs = "5.0"
chrono = "0.4"
tempfile = "3.13"
libc = "0.2"
xdg = "2.5"
which = "6.0"
glob = "0.3"
serde_json = "1.0"
libloading = "0.8"
futures-executor = "0.3"
futures-util = { version = "0.3", default-features = false }
tar = "0.4"
xz2 = "0.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
trycmd = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
