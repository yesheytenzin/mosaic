# Make the framework's priority calls work (ADR-0004's one host setting).
#
# Bionic's androidSetThreadPriority and the framework's Process.setThreadPriority
# end at setpriority, which RLIMIT_NICE caps. A user session's limit is 0, so
# nothing above niceness 20 is allowed and every audio, display and binder
# priority call fails. The system server treats some of those as fatal.
#
# A user service cannot raise the limit itself: the kernel wants privilege to
# raise a hard limit, and a user service inherits whatever its manager had. So
# the grant belongs here, on the manager, and mosaic-broker.service repeats it so
# the intent is visible where it is used. 40 allows the full range down to
# niceness -20.
[Service]
LimitNICE=40
