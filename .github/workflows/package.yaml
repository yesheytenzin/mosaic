name: Build Debian package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo and rustc are listed in debian/control Build-Depends, so the
      # package manager copies exist to satisfy dpkg-checkbuilddeps. The build
      # itself uses the newer toolchain installed above via rustup.
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dh-apparmor \
            pkg-config \
            liblzma-dev \
            cargo \
            rustc \
            rsync \
            gh

      - name: Stage source tree
        run: |
          pkg=$(dpkg-parsechangelog -S Source)
          ver=$(dpkg-parsechangelog -S Version)
          stage="build/${pkg}-${ver}"
          mkdir -p "$stage"
          rsync -a --exclude=target --exclude=.git --exclude=build ./ "$stage/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          cd "$STAGE"
          dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv build/*.deb dist/
          mv build/*.buildinfo dist/ 2>/dev/null || true
          mv build/*.changes dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
