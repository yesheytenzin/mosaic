name: Build packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo and rustc are listed in debian/control Build-Depends, so the
      # package manager copies exist to satisfy dpkg-checkbuilddeps. The build
      # itself uses the newer toolchain installed above via rustup.
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dh-apparmor \
            pkg-config \
            liblzma-dev \
            cargo \
            rustc \
            rsync \
            gh

      - name: Stage source tree
        run: |
          pkg=$(dpkg-parsechangelog -S Source)
          ver=$(dpkg-parsechangelog -S Version)
          stage="build/${pkg}-${ver}"
          mkdir -p "$stage"
          rsync -a --exclude=target --exclude=.git --exclude=build ./ "$stage/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          cd "$STAGE"
          dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv build/*.deb dist/
          mv build/*.buildinfo dist/ 2>/dev/null || true
          mv build/*.changes dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/*
          if-no-files-found: error

  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust pkgconf

      # makepkg refuses to run as root; the image default user is root, so
      # build as an unprivileged user that owns the checkout.
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c \
            "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --nodeps --noconfirm"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - deb
      - arch
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" $(find dist -type f) --generate-notes
